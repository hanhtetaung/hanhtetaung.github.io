function P(a) {
  let i = a.querySelector("footer"), c = a.getElementById("highlight-base"), l = a.getElementById("highlight-lens"), s = a.getElementById("lens-ring"), f = a.getElementById("highlight-wrap");
  if (!i || !c || !l || !s || !f)
    return;
  function g(n) {
    let m = c.getBoundingClientRect(), p = n.clientX - m.left, b = n.clientY - m.top, u = s.offsetWidth / 2;
    s.style.left = `${p - u}px`, s.style.top = `${b - u}px`, l.style.clipPath = `circle(${u}px at ${p}px ${b}px)`;
  }
  function h() {
    s.setAttribute("data-visible", "true");
  }
  function r() {
    s.removeAttribute("data-visible"), l.style.clipPath = "circle(0px at 50% 50%)";
  }
  return i.addEventListener("mousemove", g), i.addEventListener("mouseenter", h), i.addEventListener("mouseleave", r), () => {
    i.removeEventListener("mousemove", g), i.removeEventListener("mouseenter", h), i.removeEventListener("mouseleave", r);
  };
}
