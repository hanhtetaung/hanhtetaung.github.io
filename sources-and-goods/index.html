<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sources & Goods</title>

    <link rel="stylesheet" href="/sources-and-goods/scss/main.css" />

    <!-- Cytoscape core + fCoSE layout (fCoSE registers itself automatically
     once these three scripts are present, in this order) -->
    <script src="https://unpkg.com/cytoscape/dist/cytoscape.min.js"></script>
    <script src="https://unpkg.com/layout-base/layout-base.js"></script>
    <script src="https://unpkg.com/cose-base/cose-base.js"></script>
    <script src="https://unpkg.com/cytoscape-fcose/cytoscape-fcose.js"></script>
  </head>
  <body>
    <main class="main">
      <div class="center">
        <header class="header">
          <h1 class="display">Knowledge Tree</h1>

          <div class="legend">
            <span class="small"><i class="source"></i>Source</span>
            <span class="small"><i class="goods"></i>Goods</span>
          </div>
        </header>
        <div id="cy"></div>
      </div>

      <div class="right">
        <div class="empty" id="empty">
          <img
            src="/sources-and-goods/assets/icons/select-node.svg"
            alt="Select a Node"
            class="icon-empty"
          />
          <div class="empty__content">
            <h2>Select a node</h2>
            <p>Select a node to see its source and related goods.</p>
          </div>
        </div>

        <div id="card" class="card">
          <div class="card__header">
            <span class="small" id="c-kicker">Element</span>
            <h2 id="c-name" class="">—</h2>
          </div>

          <div class="card__content">
            <!-- New: Sources Section (Raw materials) -->
            <div id="c-sources-section" class="source-section">
              <div class="source-section__heading">
                <h3 class="heading">Sources</h3>
              </div>
              <div id="c-sources" class="source-section__sources"></div>
            </div>

            <!-- New: Made up of Section (Direct components) -->
            <div id="c-components-section" class="component-section">
              <div class="component-section__heading">
                <h3 class="heading">Components</h3>
              </div>
              <div id="c-components" class="row-list"></div>
            </div>

            <!-- Used in Section -->
            <div id="c-used-section" class="use-section">
              <div class="use-section__heading">
                <h3 class="heading">Uses</h3>
              </div>
              <div id="c-used" class="row-list"></div>
            </div>
          </div>
        </div>
      </div>
    </main>

    <script src="data.js"></script>
    <script src="cy-style.js"></script>
    <script src="app.js"></script>
  </body>
</html>
